# Descall — Render Blueprint (FREE tier)
# URL: https://des-call.onrender.com

previews:
  generation: off

envVarGroups:
  - name: descall-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

services:
  - type: web
    name: des-call
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    # --include=dev: vite is a devDependency; NODE_ENV=production skips it otherwise
    buildCommand: cd frontend && npm install --include=dev && npm run build:prod && cd backend && npm install
    startCommand: cd frontend/backend && NODE_ENV=production node server.js
    envVars:
      - fromGroup: descall-secrets
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: ALLOW_ALL_ORIGINS
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://des-call.onrender.com
