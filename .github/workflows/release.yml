name: Publish Descall release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build signed APK
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build:prod
          npx cap sync android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/descall-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=app/descall-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Descall-APK-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: frontend/Descall-APK-*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build Windows setup
        working-directory: frontend
        run: npm ci; npm run electron:build:win
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: frontend/release/*.exe }

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets }
      - name: Publish GitHub release
        env: { GH_TOKEN: ${{ github.token }} }
        run: gh release create "${GITHUB_REF_NAME}" release-assets/android-apk/* release-assets/windows-setup/* --generate-notes
name: Build and Release Descall Electron

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Optional — only when cutting a release from main without a local tag (patch/minor/major)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [win]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Clean cache and install dependencies
        working-directory: frontend
        run: |
          npm cache clean --force
          npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Electron builds always ship against production (never staging).
          # Runtime also forces this in frontend/src/config/api.js for Electron.
          VITE_API_BASE_URL: https://des-call.onrender.com

      - name: Debug - Check dist contents
        working-directory: frontend
        shell: cmd
        run: |
          echo "=== dist folder contents ==="
          dir dist /s
          echo "=== Checking assets ==="
          if exist dist\assets\*.js (echo "JS files found") else (echo "ERROR: No JS files in assets!")

      - name: Sync version from tag
        working-directory: frontend/electron
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $tagName = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Write-Host "New version: $tagName"
          (Get-Content package.json) -replace '"version": "[^"]+"', "`"version`": `"$tagName`"" | Set-Content package.json
          Get-Content package.json | Select-String "version"

      - name: Clean and install Electron dependencies
        working-directory: frontend/electron
        shell: powershell
        run: |
          npm cache clean --force
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue }
          npm install

      - name: Run prebuild cleanup
        working-directory: frontend/electron
        shell: powershell
        run: |
          if (Test-Path prebuild.js) { node prebuild.js }

      - name: Verify dist folder exists
        working-directory: frontend
        shell: cmd
        run: |
          echo "=== Checking frontend/dist ==="
          dir dist /s
          if not exist dist\index.html (
            echo "ERROR: dist\index.html not found!"
            exit 1
          )
          echo "dist\index.html exists"

      - name: Build Electron app
        working-directory: frontend/electron
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_CACHE: "true"

      - name: List build output
        working-directory: frontend/electron
        shell: cmd
        run: |
          echo "=== Build output ==="
          dir dist /s
          echo "=== Looking for .exe files ==="
          dir dist\*.exe /s /b

      - name: Debug - Check resources folder
        working-directory: frontend/electron
        shell: cmd
        run: |
          echo "=== Checking unpacked resources ==="
          for /f "delims=" %%i in ('dir /s /b dist\win-unpacked\resources 2^>nul') do (
            echo "Found: %%i"
          )
          if exist dist\win-unpacked\resources\app.asar (
            echo "app.asar exists"
          ) else (
            echo "app.asar NOT found"
          )
          if exist dist\win-unpacked\resources\dist (
            echo "dist folder exists in resources"
            dir dist\win-unpacked\resources\dist /s
          ) else (
            echo "dist folder NOT in resources"
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-${{ matrix.platform }}
          path: frontend/electron/dist/**
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # latest.yml + blockmap are required for electron-updater silent auto-update
          files: |
            **/Descall-Setup-*.exe
            **/Descall-Setup-*.exe.blockmap
            **/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # update-download-page job removed - version is now fetched dynamically from GitHub API
