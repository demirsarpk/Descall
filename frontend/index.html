    <style>
      /* Critical boot splash — paints before JS bundle */
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0c10;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(88, 101, 242, 0.28), transparent 55%),
          radial-gradient(90% 60% at 100% 100%, rgba(35, 165, 90, 0.1), transparent 50%),
          radial-gradient(70% 50% at 0% 80%, rgba(88, 101, 242, 0.12), transparent 45%),
          #0b0c10;
        color: #f2f3f5;
        font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif !important;
        transition: opacity 0.55s ease, visibility 0.55s ease, transform 0.55s ease;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.03);
        pointer-events: none;
      }
      #boot-splash * {
        font-family: inherit !important;
        box-sizing: border-box;
      }
      .boot-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(48px);
        opacity: 0.55;
        pointer-events: none;
        animation: boot-orb-drift 7s ease-in-out infinite alternate;
      }
      .boot-orb--a {
        width: min(48vw, 280px);
        height: min(48vw, 280px);
        background: rgba(88, 101, 242, 0.45);
        top: 12%;
        left: 10%;
      }
      .boot-orb--b {
        width: min(40vw, 220px);
        height: min(40vw, 220px);
        background: rgba(99, 210, 160, 0.22);
        bottom: 14%;
        right: 12%;
        animation-delay: -2.5s;
      }
      @keyframes boot-orb-drift {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to { transform: translate3d(18px, -22px, 0) scale(1.08); }
      }
      .boot-card {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 28px 24px;
        text-align: center;
        animation: boot-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(18px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .boot-mark {
        width: 92px;
        height: 92px;
        border-radius: 26px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(160deg, rgba(255,255,255,0.08), transparent 40%),
          linear-gradient(145deg, #2a2d3a, #171922);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow:
          0 20px 50px rgba(0,0,0,0.45),
          0 0 0 1px rgba(88,101,242,0.15),
          0 0 40px rgba(88,101,242,0.25);
        animation: boot-mark-pulse 2.4s ease-in-out infinite;
      }
      @keyframes boot-mark-pulse {
        0%, 100% { box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(88,101,242,0.15), 0 0 36px rgba(88,101,242,0.22); transform: scale(1); }
        50% { box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(88,101,242,0.3), 0 0 56px rgba(88,101,242,0.4); transform: scale(1.03); }
      }
      .boot-mark span {
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #c5ccff 0%, #7b89ff 45%, #5865f2 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }
      .boot-title {
        margin: 4px 0 0;
        font-size: clamp(28px, 6vw, 36px);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #f7f8fa;
      }
      .boot-sub {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #9aa3b2;
        letter-spacing: 0.02em;
      }
      .boot-bar {
        width: min(220px, 56vw);
        height: 4px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
      }
      .boot-bar > i {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4752c4, #7b89ff, #3ecf8e);
        animation: boot-bar-slide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-bar-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      .boot-status {
        margin: 0;
        min-height: 1.2em;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6f7888;
        animation: boot-status-fade 1.8s ease-in-out infinite;
      }
      @keyframes boot-status-fade {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-orb, .boot-mark, .boot-bar > i, .boot-status, .boot-card {
          animation: none !important;
        }
      }
    </style>

    <script>
      (function () {
        var el = document.getElementById("boot-splash");
        if (el) el.setAttribute("data-shown-at", String(Date.now()));
        window.__descallDismissBootSplash = function (opts) {
          var root = document.getElementById("boot-splash");
          if (!root || root.classList.contains("boot-splash--hide")) return;
          var minMs = (opts && opts.minMs) || 1100;
          var shownAt = Number(root.getAttribute("data-shown-at") || Date.now());
          var wait = Math.max(0, minMs - (Date.now() - shownAt));
          var status = document.getElementById("boot-status");
          if (status) status.textContent = "Ready";
          window.setTimeout(function () {
            root.classList.add("boot-splash--hide");
            window.setTimeout(function () {
              if (root && root.parentNode) root.parentNode.removeChild(root);
            }, 600);
          }, wait);
        };
      })();
    </script>
    <div id="root"></div>
