    <script>
      /* Hide marketing shells immediately for authed / app routes so Privacy links
         never paint above Play (Valorant LFG) or other authenticated UI. */
      (function () {
        try {
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          var appPrefixes = ["/direct", "/groups", "/servers", "/friends", "/calls", "/activity", "/play", "/settings"];
          var isApp = false;
          for (var i = 0; i < appPrefixes.length; i++) {
            var p = appPrefixes[i];
            if (path === p || path.indexOf(p + "/") === 0) {
              isApp = true;
              break;
            }
          }
          var hasToken = false;
          try {
            hasToken = !!localStorage.getItem("descall_token");
          } catch (e0) {}
          if (!isApp && !hasToken) return;
          document.documentElement.setAttribute("data-react-ready", "1");
          var seo = document.getElementById("seo-static");
          if (seo) {
            seo.setAttribute("hidden", "");
            seo.setAttribute("aria-hidden", "true");
            seo.style.display = "none";
          }
          var consent = document.getElementById("mkt-consent-static");
          if (consent) {
            consent.hidden = true;
            consent.style.display = "none";
          }
        } catch (e1) {}
      })();
    </script>
    <div id="boot-splash" data-shown-at="" role="progressbar" aria-busy="true" aria-label="Starting Descall">
      <div class="boot-orb boot-orb--a" aria-hidden="true"></div>

        <div class="boot-bar" aria-hidden="true"><i></i></div>
        <p class="boot-status" id="boot-status">Starting</p>
      </div>
    </div>
    <script>
      /* Boot splash only — prerender strips this with #boot-splash. */
      (function () {
        var el = document.getElementById("boot-splash");
        if (el) el.setAttribute("data-shown-at", String(Date.now()));
        window.__descallDismissBootSplash = function (opts) {
          var root = document.getElementById("boot-splash");
          if (!root || root.classList.contains("boot-splash--hide")) return;
          var minMs = (opts && typeof opts.minMs === "number") ? opts.minMs : 1100;
          var shownAt = Number(root.getAttribute("data-shown-at") || Date.now());
          var wait = Math.max(0, minMs - (Date.now() - shownAt));
          var status = document.getElementById("boot-status");
          if (status) status.textContent = "Ready";
          window.setTimeout(function () {
            root.classList.add("boot-splash--hide");
            window.setTimeout(function () {
              if (root && root.parentNode) root.parentNode.removeChild(root);
            }, 600);
          }, wait);
        };
        // Prerendered marketing HTML: keep #seo-static visible and skip the splash overlay.
        var seo = document.getElementById("seo-static");
        if (seo && seo.childElementCount > 0) {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
      })();
    </script>
    <script>
      /* Marketing shell: consent + hydrate hooks — must survive prerender splash strip. */
      (function () {
        document.addEventListener(
          "click",
          function (ev) {
            var consentBtn = ev.target && ev.target.closest && ev.target.closest("[data-consent]");
            if (consentBtn) {
              ev.preventDefault();
              var choice = consentBtn.getAttribute("data-consent");
              try {
                localStorage.setItem(
                  "descall:cookie_consent_v1",
                  JSON.stringify({ choice: choice, at: new Date().toISOString() })
                );
              } catch (e0) {}
              if (choice === "accepted") {
                try {
                  sessionStorage.setItem("descall:analytics_allowed", "1");
                  window.__descallAnalyticsAllowed = true;
                  window.dispatchEvent(new CustomEvent("descall:analytics-allowed"));
                } catch (e1) {}
              }
              document.documentElement.setAttribute("data-has-consent", "1");
              var box = document.getElementById("mkt-consent-static");
              if (box) {
                box.hidden = true;
                box.style.display = "none";
              }
              try {
                var payload = JSON.stringify({
                  choice: choice,
                  path: location.pathname,
                  at: new Date().toISOString(),
                  surface: "static_banner",
                });
                var api =
                  (window.__DESCALL_API_URL__ || "https://des-call.onrender.com").replace(/\/$/, "") +
                  "/api/marketing/consent-event";
                if (navigator.sendBeacon) {
                  navigator.sendBeacon(api, new Blob([payload], { type: "application/json" }));
                }
              } catch (eBeacon) {}
              return;
            }
            var btn = ev.target && ev.target.closest && ev.target.closest("[data-hydrate]");
            if (!btn) return;
            ev.preventDefault();
            try {
              var auth = btn.getAttribute("data-auth");
              if (auth) sessionStorage.setItem("descall:open_auth", auth);
            } catch (e) {}
            try {
              window.dispatchEvent(
                new CustomEvent("descall:hydrate-marketing", {
                  detail: { auth: btn.getAttribute("data-auth") || "" },
                })
              );
            } catch (e2) {}
            // Warm the marketing hydrate chunk on intent.
            try {
              var link = document.createElement("link");
              link.rel = "prefetch";
              link.as = "script";
              // Vite hashed name unknown here — event listener in main.jsx handles real prefetch.
              window.dispatchEvent(new CustomEvent("descall:prefetch-hydrate"));
            } catch (e3) {}
          },
          true
        );
        // Hover/focus prefetch for hydrate CTAs
        document.addEventListener(
          "pointerenter",
          function (ev) {
            var btn = ev.target && ev.target.closest && ev.target.closest("[data-hydrate]");
            if (!btn) return;
            try {
              window.dispatchEvent(new CustomEvent("descall:prefetch-hydrate"));
            } catch (e4) {}
          },
          true
        );
      })();
    </script>
